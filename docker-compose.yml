services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tecky-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: tecky_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tecky_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: